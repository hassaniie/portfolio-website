<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 620" width="520" height="620">
  <defs>
    <radialGradient id="glow" cx="50%" cy="68%" r="72%">
      <stop offset="0%" stop-color="#ff8a3d"/>
      <stop offset="42%" stop-color="#e9490a"/>
      <stop offset="78%" stop-color="#8f1f00"/>
      <stop offset="100%" stop-color="#2c0a00"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>

  <rect width="520" height="620" fill="url(#glow)"/>
  <rect width="520" height="620" fill="url(#shade)"/>

  <!-- soft bust silhouette -->
  <g fill="#1a0800" opacity="0.28" filter="url(#soft)">
    <circle cx="260" cy="300" r="86"/>
    <path d="M120 620 C120 470 180 408 260 408 C340 408 400 470 400 620 Z"/>
  </g>

  <!-- monogram -->
  <text x="50%" y="52%" text-anchor="middle" dy="0.35em"
    font-family="Georgia, 'Times New Roman', serif" font-style="italic"
    font-size="150" fill="#fff" fill-opacity="0.9">HM</text>

  <text x="50%" y="90%" text-anchor="middle"
    font-family="'Helvetica Neue', Arial, sans-serif" font-size="16"
    letter-spacing="3" fill="#fff" fill-opacity="0.72">ADD YOUR PORTRAIT</text>
</svg>
